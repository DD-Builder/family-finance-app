<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" font-family="DM Sans, system-ui, sans-serif" font-size="12" color="#7c5cbf" role="img" aria-label="Lot-selection decision tree: FIFO vs HIFO vs TLH-aware, then iterate fills and classify holding period">
  <title>Sell Optimizer · Lot-selection decision tree</title>
  <desc>How selectLotsForTarget chooses lots: FIFO orders by oldest acquisition date, HIFO orders by highest cost basis, TLH-aware prefers underwater lots first then HIFO. Each fill classifies the holding period at the 365-day boundary.</desc>

  <defs>
    <marker id="s-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c5cbf"/>
    </marker>
  </defs>

  <g font-size="12" text-anchor="middle">
    <!-- Start -->
    <rect x="280" y="20" width="180" height="48" rx="24" fill="#f5f0ff" stroke="#7c5cbf"/>
    <text x="370" y="40" fill="#1a1f27" font-weight="600">Sell target qty Q at price P</text>
    <text x="370" y="56" fill="#7d8694" font-size="11">selectLotsForTarget(symbol, Q, strategy)</text>

    <!-- Strategy diamond -->
    <polygon points="370,100 470,150 370,200 270,150" fill="#ffffff" stroke="#7c5cbf"/>
    <text x="370" y="148" fill="#1a1f27" font-weight="600">Strategy?</text>
    <text x="370" y="164" fill="#7d8694" font-size="11">FIFO · HIFO · TLH</text>

    <!-- 3 strategies -->
    <rect x="20" y="230" width="180" height="56" rx="8" fill="#ecfdf5" stroke="#0d9f6e" stroke-opacity="0.65"/>
    <text x="110" y="252" fill="#1a1f27" font-weight="600">FIFO</text>
    <text x="110" y="268" fill="#3d4451" font-size="11">order by acquisitionDate ASC</text>
    <text x="110" y="280" fill="#3d4451" font-size="11">(oldest first)</text>

    <rect x="280" y="230" width="180" height="56" rx="8" fill="#fffbeb" stroke="#d97706" stroke-opacity="0.65"/>
    <text x="370" y="252" fill="#1a1f27" font-weight="600">HIFO</text>
    <text x="370" y="268" fill="#3d4451" font-size="11">order by costBasisPerETH DESC</text>
    <text x="370" y="280" fill="#3d4451" font-size="11">(minimize current gain)</text>

    <rect x="540" y="230" width="160" height="56" rx="8" fill="#fef2f2" stroke="#e74c4c" stroke-opacity="0.65"/>
    <text x="620" y="248" fill="#1a1f27" font-weight="600">TLH-aware</text>
    <text x="620" y="264" fill="#3d4451" font-size="11">underwater lots first</text>
    <text x="620" y="278" fill="#3d4451" font-size="11">(realize losses; then HIFO)</text>

    <!-- Loop -->
    <rect x="270" y="320" width="200" height="40" rx="6" fill="#ffffff" stroke="#7c5cbf"/>
    <text x="370" y="338" fill="#1a1f27">Walk lots in chosen order</text>
    <text x="370" y="352" fill="#7d8694" font-size="11">while remaining &gt; 0</text>

    <!-- Reduce -->
    <rect x="100" y="390" width="220" height="48" rx="6" fill="#ffffff" stroke="#7c5cbf" stroke-opacity="0.55"/>
    <text x="210" y="408" fill="#1a1f27">Reduce lot.ethQty</text>
    <text x="210" y="424" fill="#7d8694" font-size="11">by min(remaining, lot.ethQty)</text>

    <!-- Realize -->
    <rect x="420" y="390" width="220" height="48" rx="6" fill="#ffffff" stroke="#7c5cbf" stroke-opacity="0.55"/>
    <text x="530" y="408" fill="#1a1f27">Realize gain</text>
    <text x="530" y="424" fill="#7d8694" font-size="11">(P − costBasisPerETH) × qty</text>

    <!-- Holding diamond -->
    <polygon points="370,460 470,500 370,540 270,500" fill="#ffffff" stroke="#7c5cbf"/>
    <text x="370" y="495" fill="#1a1f27" font-weight="600">Held ≥ 365 d?</text>
    <text x="370" y="511" fill="#7d8694" font-size="11">HOLDING_PERIOD_DAYS</text>

    <!-- LT / ST badges (small annotations on left/right of holding diamond) -->
    <rect x="180" y="478" width="80" height="44" rx="6" fill="#ecfdf5" stroke="#0d9f6e"/>
    <text x="220" y="497" fill="#1a1f27" font-weight="600">LT gain</text>
    <text x="220" y="513" fill="#7d8694" font-size="11">0/15/20 §1(h)</text>

    <rect x="490" y="478" width="80" height="44" rx="6" fill="#fef2f2" stroke="#e74c4c"/>
    <text x="530" y="497" fill="#1a1f27" font-weight="600">ST gain</text>
    <text x="530" y="513" fill="#7d8694" font-size="11">ord. brackets</text>
  </g>

  <!-- Connectors -->
  <g stroke="#7c5cbf" stroke-opacity="0.7" fill="none">
    <line x1="370" y1="68" x2="370" y2="98" marker-end="url(#s-arrow)"/>
    <!-- diamond to 3 -->
    <path d="M 270 150 Q 200 180 110 230" marker-end="url(#s-arrow)"/>
    <line x1="370" y1="200" x2="370" y2="230" marker-end="url(#s-arrow)"/>
    <path d="M 470 150 Q 540 180 620 230" marker-end="url(#s-arrow)"/>
    <!-- 3 to loop -->
    <path d="M 110 286 Q 130 310 280 320" marker-end="url(#s-arrow)"/>
    <line x1="370" y1="286" x2="370" y2="320" marker-end="url(#s-arrow)"/>
    <path d="M 620 286 Q 600 310 460 320" marker-end="url(#s-arrow)"/>
    <!-- loop to reduce / realize -->
    <path d="M 320 360 Q 280 380 230 390" marker-end="url(#s-arrow)"/>
    <path d="M 420 360 Q 460 380 510 390" marker-end="url(#s-arrow)"/>
    <!-- realize to holding -->
    <line x1="530" y1="438" x2="430" y2="475" marker-end="url(#s-arrow)"/>
    <line x1="210" y1="438" x2="310" y2="475" marker-end="url(#s-arrow)"/>
    <!-- holding to LT/ST -->
    <line x1="270" y1="500" x2="262" y2="500" marker-end="url(#s-arrow)"/>
    <line x1="470" y1="500" x2="488" y2="500" marker-end="url(#s-arrow)"/>
  </g>
</svg>
