<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="DM Sans, system-ui, sans-serif" font-size="12" color="#7c5cbf" role="img" aria-label="Tax-calculation pipeline: gross income through AGI, ordinary brackets, LT cap-gains 0/15/20, NIIT, safe harbor, quarterly estimate">
  <title>Tax-calculation pipeline</title>
  <desc>From gross income to quarterly estimate. Filing-status-aware brackets, IRC §1(h) LT cap-gains tiers, and NIIT computed against MAGI per Reg §1.1411-1(d).</desc>

  <defs>
    <marker id="t-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c5cbf"/>
    </marker>
  </defs>

  <!-- Helper styles via inline -->
  <g font-size="12" text-anchor="middle">
    <!-- Gross income -->
    <rect x="280" y="20" width="200" height="56" rx="8" fill="#f5f0ff" stroke="#7c5cbf" stroke-opacity="0.65"/>
    <text x="380" y="40" fill="#1a1f27" font-weight="600">Gross income</text>
    <text x="380" y="56" fill="#3d4451" font-size="11">W-2 + 1099 + interest + dividends</text>
    <text x="380" y="70" fill="#3d4451" font-size="11">+ ST/LT gains + staking FMV</text>

    <!-- Adjustments -->
    <rect x="290" y="100" width="180" height="40" rx="6" fill="#ffffff" stroke="#7c5cbf" stroke-opacity="0.55"/>
    <text x="380" y="118" fill="#1a1f27">Above-the-line adjustments</text>
    <text x="380" y="132" fill="#7d8694" font-size="11">§62</text>

    <!-- AGI -->
    <rect x="320" y="160" width="120" height="40" rx="6" fill="#ffffff" stroke="#7c5cbf"/>
    <text x="380" y="184" fill="#1a1f27" font-weight="600">AGI</text>

    <!-- Std Ded -->
    <rect x="120" y="220" width="180" height="40" rx="6" fill="#ffffff" stroke="#7c5cbf" stroke-opacity="0.55"/>
    <text x="210" y="238" fill="#1a1f27">Standard deduction</text>
    <text x="210" y="252" fill="#7d8694" font-size="11">by filing status · §63</text>

    <!-- Taxable -->
    <rect x="120" y="280" width="180" height="40" rx="6" fill="#ffffff" stroke="#7c5cbf"/>
    <text x="210" y="304" fill="#1a1f27">Taxable ordinary income</text>

    <!-- Ord brackets -->
    <rect x="120" y="340" width="180" height="40" rx="6" fill="#ecfdf5" stroke="#0d9f6e" stroke-opacity="0.55"/>
    <text x="210" y="358" fill="#1a1f27">Ordinary brackets</text>
    <text x="210" y="372" fill="#7d8694" font-size="11">§1 · Rev. Proc. 2024-40</text>

    <!-- LT brackets -->
    <rect x="320" y="340" width="180" height="40" rx="6" fill="#fffbeb" stroke="#d97706" stroke-opacity="0.55"/>
    <text x="410" y="358" fill="#1a1f27">LT cap-gains 0 / 15 / 20</text>
    <text x="410" y="372" fill="#7d8694" font-size="11">§1(h)</text>

    <!-- MAGI -->
    <rect x="540" y="220" width="180" height="40" rx="6" fill="#ffffff" stroke="#7c5cbf" stroke-opacity="0.55"/>
    <text x="630" y="238" fill="#1a1f27">MAGI for NIIT</text>
    <text x="630" y="252" fill="#7d8694" font-size="11">Reg §1.1411-1(d)</text>

    <!-- NIIT -->
    <rect x="540" y="340" width="180" height="40" rx="6" fill="#fef2f2" stroke="#e74c4c" stroke-opacity="0.55"/>
    <text x="630" y="358" fill="#1a1f27">NIIT 3.8 %</text>
    <text x="630" y="372" fill="#7d8694" font-size="11">§1411</text>

    <!-- Total -->
    <rect x="280" y="420" width="200" height="48" rx="8" fill="#f5f0ff" stroke="#7c5cbf"/>
    <text x="380" y="440" fill="#1a1f27" font-weight="600">Total federal tax</text>
    <text x="380" y="456" fill="#3d4451" font-size="11">ord + LT + NIIT</text>

    <!-- Safe harbor -->
    <rect x="120" y="500" width="200" height="40" rx="6" fill="#ffffff" stroke="#7c5cbf" stroke-opacity="0.55"/>
    <text x="220" y="518" fill="#1a1f27">Safe harbor</text>
    <text x="220" y="532" fill="#7d8694" font-size="11">100 % prior · 110 % if AGI &gt; 150k · §6654</text>

    <!-- Quarterly -->
    <rect x="440" y="500" width="200" height="40" rx="6" fill="#ecfdf5" stroke="#0d9f6e"/>
    <text x="540" y="518" fill="#1a1f27" font-weight="600">Quarterly estimate</text>
    <text x="540" y="532" fill="#7d8694" font-size="11">total / 4 vs. safe harbor</text>
  </g>

  <!-- Connectors -->
  <g stroke="#7c5cbf" stroke-opacity="0.65" fill="none">
    <line x1="380" y1="76" x2="380" y2="100" marker-end="url(#t-arrow)"/>
    <line x1="380" y1="140" x2="380" y2="160" marker-end="url(#t-arrow)"/>
    <!-- AGI -> Std ded (left) -->
    <path d="M 340 200 Q 300 200 240 220" marker-end="url(#t-arrow)"/>
    <!-- Std ded -> Taxable -->
    <line x1="210" y1="260" x2="210" y2="280" marker-end="url(#t-arrow)"/>
    <!-- Taxable -> Ord brackets -->
    <line x1="210" y1="320" x2="210" y2="340" marker-end="url(#t-arrow)"/>
    <!-- AGI -> LT brackets -->
    <line x1="400" y1="200" x2="410" y2="340" marker-end="url(#t-arrow)"/>
    <!-- AGI -> MAGI (right) -->
    <path d="M 420 200 Q 480 200 555 220" marker-end="url(#t-arrow)"/>
    <!-- MAGI -> NIIT -->
    <line x1="630" y1="260" x2="630" y2="340" marker-end="url(#t-arrow)"/>
    <!-- 3 -> Total -->
    <path d="M 210 380 Q 250 400 320 420" marker-end="url(#t-arrow)"/>
    <line x1="410" y1="380" x2="395" y2="420" marker-end="url(#t-arrow)"/>
    <path d="M 630 380 Q 580 400 460 420" marker-end="url(#t-arrow)"/>
    <!-- Total -> Safe harbor / Quarterly -->
    <path d="M 320 460 Q 270 480 240 500" marker-end="url(#t-arrow)"/>
    <path d="M 440 460 Q 480 480 530 500" marker-end="url(#t-arrow)"/>
    <line x1="320" y1="520" x2="440" y2="520" marker-end="url(#t-arrow)"/>
  </g>
</svg>
