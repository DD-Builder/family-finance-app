<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />
    <!--
      Phase 22.3 — Content Security Policy.

      Tight by default: scripts + workers + manifests + XHR are
      same-origin only. Fonts are SELF-HOSTED (public/fonts, OFL) so no
      font/style third-party origins exist at all. No `'unsafe-inline'`
      for scripts — the boot-error handler lives in /boot.js
      (same-origin) instead of an inline <script>. `'unsafe-inline'`
      for styles remains: ECharts and the theme runtime assign element
      style attributes at render time.

      http://127.0.0.1:8080 is the OPTIONAL local trader service
      (Settings → Trader Link): a loopback-only push of portfolio
      snapshots — data never crosses the network. Loopback is exempt
      from mixed-content blocking per the Secure Contexts spec.

      `frame-ancestors` and `report-uri` aren't honoured in <meta>
      CSP — set them as HTTP headers at the deploy layer
      (X-Frame-Options: DENY is sufficient for clickjacking).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self' http://127.0.0.1:8080 https://api.crypto.com wss://advanced-trade-ws.coinbase.com https://api.coingecko.com https://home.treasury.gov https://stooq.com https://finnhub.io https://cloudflare-eth.com https://rpc.ankr.com https://eth-mainnet.g.alchemy.com https://mainnet.base.org https://base-mainnet.g.alchemy.com https://financialmodelingprep.com https://api.alternative.me; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <!--
      Phase U Sprint 6 — F-OPS-P0-1 (partial fix).
      Referrer-Policy is one of the few headers <meta> honors. The
      remainder (COOP, COEP, CORP, X-Frame-Options, X-Content-Type-
      Options, Permissions-Policy) are HTTP-header-only and require
      the deploy target to emit them. public/_headers stages them for
      a Cloudflare Pages migration; until then this meta tag closes
      the referrer-leak portion of the audit finding.
    -->
    <meta name="referrer" content="no-referrer" />
